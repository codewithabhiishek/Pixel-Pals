<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <title>Pixel Pals: Adventure Run</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
        position: fixed; inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        margin: 0; width: 100%; height: 100%; height: 100dvh;
        position: fixed; inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; gap: 16px;
        align-items: center; justify-content: center; text-align: center; padding: 24px;
        font-family: monospace; color: #ffc94d; letter-spacing: 2px; font-size: 12px;
        background: #0b1f2c;
      }
      #boot .flame { width: 20px; height: 20px; border-radius: 50% 50% 50% 0; background: #ff8c3b;
        transform: rotate(-45deg); animation: bootpulse 0.9s ease-in-out infinite; }
      #boot .sub { color: #fdf3e3; opacity: 0.55; letter-spacing: 0.5px; font-size: 11px; }
      #boot.err .flame { background: #ff5a5f; animation: none; }
      #boot.err #boot-msg { color: #ff5a5f; }
      @keyframes bootpulse { 0%,100% { transform: rotate(-45deg) scale(1); opacity: 1; } 50% { transform: rotate(-45deg) scale(0.72); opacity: 0.6; } }
    </style>
    <script>
      // Prevent Safari iOS pinch-to-zoom gestures
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot"><div class="flame"></div><span id="boot-msg">GETTING READY…</span><span class="sub">Pixel Pals are waking up</span></div>
    </div>
    <!-- plain (non-module) watchdog: runs even if module loading is blocked, and reports failures visibly -->
    <script>
      window.__booted = false;
      window.addEventListener("error", function (ev) {
        var el = document.getElementById("boot");
        var msg = document.getElementById("boot-msg");
        if (el && msg && !window.__booted) {
          el.classList.add("err");
          msg.textContent = "Startup error: " + (ev && ev.message ? ev.message : "unknown");
        }
      });
      setTimeout(function () {
        if (!window.__booted) {
          var el = document.getElementById("boot");
          var msg = document.getElementById("boot-msg");
          if (el && msg && !el.classList.contains("err")) {
            el.classList.add("err");
            msg.textContent = "The game script could not start in this window.";
            var sub = el.querySelector(".sub");
            if (sub) sub.textContent = "Try refreshing the preview, or opening it in a new tab.";
          }
        }
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
